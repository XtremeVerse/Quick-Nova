<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Generator - QuickNova</title>
    <meta name="description" content="Generate creative stories from prompts with AI. Customize genre, tone, and characters.">
    <meta name="keywords" content="story generator, ai story writer, plot generator, creative writing, novel writer">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://quicknova.com/tools/story-generator.html">
    <meta property="og:title" content="Story Generator - QuickNova">
    <meta property="og:description" content="Generate creative stories from prompts. Free online tool.">
    <meta property="og:image" content="https://quicknova.com/assets/og-image.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://quicknova.com/tools/story-generator.html">
    <meta property="twitter:title" content="Story Generator - QuickNova">
    <meta property="twitter:description" content="Generate creative stories from prompts. Free online tool.">
    <meta property="twitter:image" content="https://quicknova.com/assets/og-image.jpg">
    
    <link rel="canonical" href="https://quicknova.com/tools/story-generator.html">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    
    <style>
        .app-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 0;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        .controls-sidebar {
            background: var(--bg-elevated);
            border-right: 1px solid var(--border-subtle);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            overflow-y: auto;
        }

        .workspace {
            padding: 2rem;
            overflow-y: auto;
            background: var(--bg-subtle);
            display: flex;
            justify-content: center;
        }

        .story-paper {
            background: var(--bg);
            width: 100%;
            max-width: 800px;
            min-height: 100%;
            padding: 3rem;
            box-shadow: var(--shadow-md);
            border-radius: 4px;
            position: relative;
        }

        .paper-header {
            border-bottom: 2px solid var(--border-subtle);
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .paper-title {
            font-family: 'Georgia', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            border: none;
            background: transparent;
            width: 100%;
        }

        .paper-title:focus {
            outline: none;
        }

        .story-content {
            font-family: 'Georgia', serif;
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--text-main);
            min-height: 500px;
            outline: none;
            white-space: pre-wrap;
        }

        .paper-actions {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .story-paper:hover .paper-actions {
            opacity: 1;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .setting-input, .setting-select, .setting-textarea {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            background: var(--bg);
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .setting-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .history-item {
            padding: 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-item:hover {
            border-color: var(--primary);
            background: var(--bg-hover);
        }

        .history-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
            color: var(--text-main);
        }

        .history-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        @media (max-width: 900px) {
            .app-container {
                grid-template-columns: 1fr;
                height: auto;
                overflow: visible;
            }
            .story-paper {
                padding: 1.5rem;
            }
        }
    </style>
    <script src="/js/tools-mobile-optimizer.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="logo">QuickNova</a>
            <nav class="nav-links">
                <a href="/">Home</a>
                <a href="/tools/">Tools</a>
                <a href="/about.html">About</a>
                <button class="theme-toggle" aria-label="Toggle Theme">🌙</button>
            </nav>
            <button class="mobile-menu-btn" aria-label="Menu">☰</button>
        </div>
    </header>

    <main class="app-container">
        <!-- Sidebar Controls -->
        <aside class="controls-sidebar">
            <div class="tool-header-mini">
                <h2 style="font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem;">
                    📖 Story Generator
                </h2>
                <p style="font-size: 0.85rem; color: var(--text-muted);">Weave tales with AI.</p>
            </div>

            <div class="control-group">
                <label class="control-label">Core Idea / Prompt</label>
                <textarea id="prompt-input" class="setting-textarea" placeholder="e.g., A time traveler who gets stuck in the 1920s..."></textarea>
            </div>

            <div class="control-group">
                <label class="control-label">Genre</label>
                <select id="genre-select" class="setting-select">
                    <option value="Fantasy">Fantasy</option>
                    <option value="Sci-Fi">Science Fiction</option>
                    <option value="Mystery">Mystery / Thriller</option>
                    <option value="Horror">Horror</option>
                    <option value="Romance">Romance</option>
                    <option value="Adventure">Adventure</option>
                    <option value="Comedy">Comedy</option>
                    <option value="Dystopian">Dystopian</option>
                    <option value="Historical">Historical Fiction</option>
                    <option value="Fairy Tale">Fairy Tale</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label">Tone</label>
                <select id="tone-select" class="setting-select">
                    <option value="Neutral">Neutral</option>
                    <option value="Dark">Dark & Gritty</option>
                    <option value="Humorous">Humorous & Witty</option>
                    <option value="Emotional">Emotional & Moving</option>
                    <option value="Suspenseful">Suspenseful</option>
                    <option value="Whimsical">Whimsical</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label">Length</label>
                <select id="length-select" class="setting-select">
                    <option value="Short">Short Story (Flash Fiction)</option>
                    <option value="Medium" selected>Medium (Standard)</option>
                    <option value="Long">Long (Detailed)</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label">Optional Details</label>
                <input type="text" id="protagonist-input" class="setting-input" placeholder="Protagonist Name">
                <input type="text" id="setting-input" class="setting-input" placeholder="Setting (e.g., Mars, Paris)" style="margin-top: 0.5rem;">
            </div>

            <button id="generate-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                Generate Story
            </button>

            <hr style="border-color: var(--border-subtle); margin: 0.5rem 0;">

            <div class="control-group">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label class="control-label">Library</label>
                    <button id="clear-history-btn" class="panel-btn" title="Clear History" style="background:none; border:none; cursor:pointer;">🗑️</button>
                </div>
                <div id="history-list" class="history-list">
                    <!-- History items -->
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <section class="workspace">
            <div class="story-paper">
                <div class="paper-actions">
                    <button id="copy-btn" class="btn btn-sm btn-secondary">Copy</button>
                    <button id="download-btn" class="btn btn-sm btn-secondary">Download</button>
                </div>
                
                <div class="paper-header">
                    <input type="text" id="story-title" class="paper-title" value="Untitled Story" readonly>
                </div>
                
                <div id="story-output" class="story-content" contenteditable="true">
                    <span style="color: var(--text-muted); font-style: italic;">Your story will be written here...</span>
                </div>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="../js/utils.js"></script>
    <script src="../js/tools/story-generator.js"></script>
</body>
</html>
