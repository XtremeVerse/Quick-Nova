<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - QuickNova</title>
    <meta name="description" content="Chat with an intelligent AI assistant. Free online AI chat tool.">
    <meta name="keywords" content="ai chat, artificial intelligence, chatbot, gpt, free ai">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://quicknova.com/tools/ai-chat.html">
    <meta property="og:title" content="AI Chat - QuickNova">
    <meta property="og:description" content="Chat with an intelligent AI assistant. Free online AI chat tool.">
    <meta property="og:image" content="https://quicknova.com/assets/og-image.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://quicknova.com/tools/ai-chat.html">
    <meta property="twitter:title" content="AI Chat - QuickNova">
    <meta property="twitter:description" content="Chat with an intelligent AI assistant. Free online AI chat tool.">
    <meta property="twitter:image" content="https://quicknova.com/assets/og-image.jpg">
    
    <link rel="canonical" href="https://quicknova.com/tools/ai-chat.html">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
        }

        .site-header {
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
            height: 64px;
            display: flex;
            align-items: center;
        }

        .site-header .container {
            width: 100%;
        }

        .main-content {
            flex: 1;
            overflow: hidden;
            display: flex;
        }

        .chat-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 0;
        }

        /* Sidebar */
        .chat-sidebar {
            width: 260px;
            background: var(--bg-elevated);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
            position: static;
            top: auto;
        }

        .sidebar-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .sidebar-header h2 {
            font-size: 1.125rem;
            font-weight: 700;
            margin: 0;
        }

        .btn-new-chat {
            padding: 0.65rem 1rem;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-new-chat:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        /* Main chat area */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            overflow: hidden;
        }

        .chat-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 4px;
        }

        .message {
            display: flex;
            gap: 1rem;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            max-width: 85%;
            flex-direction: row-reverse;
        }

        .message.ai {
            align-self: flex-start;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
            background: rgba(0, 112, 243, 0.1);
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #0070f3, #7928ca);
            color: white;
        }

        .message-content {
            padding: 1rem 1.25rem;
            border-radius: 16px;
            line-height: 1.6;
            word-break: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #0070f3, #7928ca);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-content {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        .message-content p {
            margin: 0.5rem 0;
        }

        .message-content p:first-child {
            margin-top: 0;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 2rem;
            text-align: center;
            flex: 1;
        }

        .empty-state-icon {
            font-size: 4rem;
            opacity: 0.5;
        }

        .empty-state h2 {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0;
        }

        .empty-state p {
            color: var(--text-muted);
            max-width: 400px;
            margin: 0;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
            max-width: 600px;
        }

        .quick-action-btn {
            padding: 1rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .quick-action-btn:hover {
            border-color: var(--accent-blue);
            background: rgba(0, 112, 243, 0.05);
        }

        /* Input area */
        .chat-input-section {
            padding: 1.5rem 2rem;
            border-top: 1px solid var(--border-subtle);
            background: var(--bg);
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            gap: 1rem;
            max-width: 100%;
        }

        .input-field {
            flex: 1;
            display: flex;
            gap: 0.75rem;
            padding: 0.85rem 1.5rem;
            background: var(--bg-elevated);
            border: 2px solid var(--border-subtle);
            border-radius: 24px;
            transition: all 0.2s ease;
            align-items: flex-end;
        }

        .input-field:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(0, 112, 243, 0.1);
        }

        #user-input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-main);
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            padding: 0;
            outline: none;
        }

        #user-input::placeholder {
            color: var(--text-muted);
        }

        .btn-send {
            background: linear-gradient(135deg, #0070f3, #7928ca);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .btn-send:hover:not(:disabled) {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-action {
            background: none;
            border: 1px solid var(--border-subtle);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .btn-action:hover {
            border-color: var(--accent-blue);
            background: rgba(0, 112, 243, 0.05);
        }

        /* Mode selector */
        .mode-selector {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--bg);
            flex-shrink: 0;
        }

        .mode-selector label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .mode-chips {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0;
        }

        .mode-chip {
            padding: 0.6rem 1.2rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .mode-chip:hover {
            border-color: var(--accent-blue);
            background: rgba(0, 112, 243, 0.05);
        }

        .mode-chip.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        /* Mobile responsiveness */
        @media (max-width: 900px) {
            .chat-sidebar {
                width: 0;
                padding: 0;
                border-right: none;
                position: fixed;
                left: 0;
                top: 64px;
                height: calc(100vh - 64px);
                z-index: 50;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                overflow-y: auto;
            }

            .chat-sidebar.active {
                width: 260px;
                transform: translateX(0);
            }

            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 64px;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 40;
            }

            .sidebar-overlay.active {
                display: block;
            }
        }

        @media (max-width: 600px) {
            .site-header {
                height: 56px;
            }

            .chat-messages {
                padding: 1rem;
                gap: 1rem;
            }

            .message {
                max-width: 100%;
            }

            .message.user {
                max-width: 95%;
            }

            .message-content {
                padding: 0.75rem 1rem;
                border-radius: 12px;
                font-size: 0.95rem;
            }

            .chat-header {
                padding: 1rem 1.25rem;
            }

            .chat-input-section {
                padding: 1rem 1.25rem;
            }

            .input-field {
                border-radius: 20px;
                padding: 0.65rem 1rem;
            }

            .empty-state h2 {
                font-size: 1.5rem;
            }

            .quick-actions {
                grid-template-columns: 1fr;
                margin-top: 1rem;
            }

            .mode-selector {
                padding: 0.75rem 1rem;
            }

            .mode-chips {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .mode-chip {
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
            }

            .chat-header h1 {
                font-size: 1.25rem;
            }

            .input-actions {
                display: none;
            }
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.5;
            }
            30% {
                opacity: 1;
            }
        }

        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: var(--text-main);
            font-size: 1.2rem;
        }

        .btn-icon:hover {
            background: var(--border-subtle);
        }

        .menu-toggle {
            display: none;
            margin-left: auto;
        }

        @media (max-width: 900px) {
            .menu-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner" style="display: flex; align-items: center; gap: 1rem;">
            <a href="/" class="logo">QuickNova AI</a>
            <div style="margin-left: auto; display: flex; gap: 1rem; align-items: center;">
                <button class="theme-toggle" aria-label="Toggle Theme">🌙</button>
                <button id="menu-toggle" class="btn-icon menu-toggle" aria-label="Menu">☰</button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside class="chat-sidebar" id="chat-sidebar">
            <div class="sidebar-header">
                <h2>Chat History</h2>
                <button id="close-sidebar" class="btn-icon" style="display: none;">✕</button>
            </div>
            <div style="padding: 0 1rem; padding-bottom: 1rem;">
                <button class="btn-new-chat" id="new-chat-btn">+ New Chat</button>
            </div>
            <div class="sidebar-content" id="chat-history">
                <!-- Chat history will be populated here -->
            </div>
        </aside>

        <!-- Main chat area -->
        <div class="chat-main">
            <!-- Header -->
            <div class="chat-header">
                <h1>AI Assistant</h1>
            </div>

            <!-- Mode selector -->
            <div class="mode-selector">
                <label>Select Mode:</label>
                <div class="mode-chips" id="mode-selector">
                    <button class="mode-chip active" data-persona="default">💬 Assistant</button>
                    <button class="mode-chip" data-persona="coder">💻 Coder</button>
                    <button class="mode-chip" data-persona="writer">✍️ Writer</button>
                    <button class="mode-chip" data-persona="teacher">🎓 Teacher</button>
                    <button class="mode-chip" data-persona="analyst">📊 Analyst</button>
                </div>
            </div>

            <!-- Messages area -->
            <div class="chat-messages" id="chat-messages">
                <div class="empty-state">
                    <div class="empty-state-icon">🤖</div>
                    <h2>Welcome to QuickNova AI</h2>
                    <p>Start a conversation or select a mode to get personalized assistance</p>
                    <div class="quick-actions">
                        <button class="quick-action-btn" data-prompt="Summarize: ">📝 Summarize</button>
                        <button class="quick-action-btn" data-prompt="Explain: ">💡 Explain</button>
                        <button class="quick-action-btn" data-prompt="Fix grammar: ">✓ Fix</button>
                        <button class="quick-action-btn" data-prompt="Translate: ">🌐 Translate</button>
                    </div>
                </div>
            </div>

            <!-- Input area -->
            <div class="chat-input-section">
                <div class="input-wrapper">
                    <div class="input-field">
                        <textarea id="user-input" placeholder="Type your message... (Shift+Enter for new line)" rows="1"></textarea>
                        <button class="btn-send" id="send-btn" title="Send message">↗️</button>
                    </div>
                    <div class="input-actions">
                        <button class="btn-action" id="voice-btn" title="Voice input">🎤</button>
                        <button class="btn-action" id="options-btn" title="More options">⋯</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/tools/ai-chat.js"></script>
</body>
</html>
