<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to PDF - QuickNova</title>
    <meta name="description" content="Convert text to PDF instantly. Free online tool.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <script src="/js/tools-mobile-optimizer.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="logo">QuickNova</a>
            <nav class="nav-links">
                <a href="/">Home</a>
                <a href="/tools/">Tools</a>
                <a href="/about.html">About</a>
                <a href="/contact.html">Contact</a>
                <button class="theme-toggle" aria-label="Toggle Theme">🌙</button>
            </nav>
            <button class="mobile-menu-btn" aria-label="Menu">☰</button>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="tool-header">
                <span class="tool-badge">PDF / Document</span>
                <h1 style="margin-top: 1rem;">Text to PDF</h1>
                <p style="color: var(--text-muted);">Convert plain text to a PDF document.</p>
            </div>

            <div class="tool-workspace">
                <div class="input-area">
                    <textarea id="pdf-text" class="text-area" placeholder="Type your text here..." style="min-height: 400px; width: 100%; padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border-subtle); background: var(--bg); font-family: 'Inter', sans-serif; font-size: 1rem; line-height: 1.6;"></textarea>
                </div>

                <div class="controls-area" style="margin-top: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: space-between; align-items: center;">
                    <div style="display: flex; gap: 1rem;">
                        <input type="text" id="filename" placeholder="document" style="padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border-subtle); background: var(--bg);">
                        <span style="align-self: center;">.pdf</span>
                    </div>
                    
                    <button id="download-btn" class="btn btn-primary">Download PDF</button>
                </div>
            </div>

            <div class="ad-slot ad-content">
                <span>Advertisement</span>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 QuickNova. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/tools/text-to-pdf.js"></script>
</body>
</html>
