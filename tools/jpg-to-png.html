<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPG to PNG Converter - QuickNova</title>
    <meta name="description" content="Convert JPG/JPEG images to PNG format online. Lossless conversion, batch processing, and instant download.">
    <meta name="keywords" content="jpg to png, convert jpg, image converter, batch image converter, free online converter">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://quicknova.com/tools/jpg-to-png.html">
    <meta property="og:title" content="JPG to PNG Converter - QuickNova">
    <meta property="og:description" content="Convert JPG images to PNG format online. Free & fast.">
    <meta property="og:image" content="https://quicknova.com/assets/og-image.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://quicknova.com/tools/jpg-to-png.html">
    <meta property="twitter:title" content="JPG to PNG Converter - QuickNova">
    <meta property="twitter:description" content="Convert JPG images to PNG format online. Free & fast.">
    <meta property="twitter:image" content="https://quicknova.com/assets/og-image.jpg">
    
    <link rel="canonical" href="https://quicknova.com/tools/jpg-to-png.html">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    
    <style>
        .app-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 0;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        .controls-sidebar {
            background: var(--bg-elevated);
            border-right: 1px solid var(--border-subtle);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
        }

        .workspace {
            padding: 2rem;
            overflow-y: auto;
            background: var(--bg-subtle);
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .dropzone {
            border: 2px dashed var(--border-subtle);
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
            background: var(--bg);
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            min-height: 200px;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--primary);
            background: var(--bg-hover);
        }

        .dropzone-icon {
            font-size: 3rem;
            color: var(--text-muted);
        }

        .file-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
            width: 100%;
        }

        .file-card {
            background: var(--bg);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            position: relative;
        }

        .file-preview {
            width: 100%;
            height: 150px;
            background: var(--bg-subtle);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .file-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .file-info {
            font-size: 0.85rem;
        }

        .file-name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.25rem;
        }

        .file-meta {
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .file-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
        }

        .remove-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }
        
        .remove-btn:hover {
            background: rgba(0,0,0,0.8);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .info-box {
            background: var(--bg-subtle);
            border-radius: 8px;
            padding: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
                height: auto;
                overflow: visible;
            }
            .controls-sidebar {
                border-right: none;
                border-bottom: 1px solid var(--border-subtle);
            }
        }
    </style>
    <script src="/js/tools-mobile-optimizer.js" defer></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="controls-sidebar">
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
                <a href="/" class="btn btn-ghost btn-sm" style="padding: 0.25rem;">
                    <span style="font-size: 1.2rem;">←</span>
                </a>
                <h1 style="font-size: 1.25rem; font-weight: 700; margin: 0;">JPG to PNG</h1>
            </div>

            <div class="control-group">
                <label class="control-label">Batch Actions</label>
                <button id="convert-all-btn" class="btn btn-primary" disabled>Convert All</button>
                <button id="download-all-btn" class="btn btn-secondary" disabled>Download All (ZIP)</button>
                <button id="clear-all-btn" class="btn btn-ghost" disabled>Clear All</button>
            </div>

            <div class="control-group">
                <label class="control-label">Add Files</label>
                <button onclick="document.getElementById('file-input').click()" class="btn btn-outline">
                    + Select Images
                </button>
            </div>

            <div class="info-box">
                <p><strong>Did you know?</strong></p>
                <p>Converting JPG to PNG is great for preserving image quality for future edits, as PNG is a lossless format.</p>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="workspace">
            <div id="dropzone" class="dropzone">
                <input type="file" id="file-input" multiple accept="image/jpeg, image/jpg" style="display: none;">
                <div class="dropzone-icon">🖼️</div>
                <h3>Drag & Drop JPG files here</h3>
                <p style="color: var(--text-muted);">or click to browse</p>
            </div>

            <div id="file-list" class="file-list">
                <!-- File cards will appear here -->
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/tools/jpg-to-png.js"></script>
</body>
</html>
