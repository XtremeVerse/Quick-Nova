<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merge - QuickNova</title>
    <meta name="description" content="Combine multiple PDFs into one. Free online tool.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <script src="/js/tools-mobile-optimizer.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="logo">QuickNova</a>
            <nav class="nav-links">
                <a href="/">Home</a>
                <a href="/tools/">Tools</a>
                <a href="/about.html">About</a>
                <a href="/contact.html">Contact</a>
                <button class="theme-toggle" aria-label="Toggle Theme">🌙</button>
            </nav>
            <button class="mobile-menu-btn" aria-label="Menu">☰</button>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="tool-header">
                <span class="tool-badge">Pdf Tool</span>
                <h1 style="margin-top: 1rem;">PDF Merge</h1>
                <p style="color: var(--text-muted);">Combine multiple PDFs into one.</p>
            </div>

            <div class="tool-workspace">
                <div class="glass" style="padding: 2rem;">
                    <div class="upload-area" id="drop-zone" style="border: 2px dashed var(--border-subtle); border-radius: 12px; padding: 3rem; text-align: center; cursor: pointer; transition: all 0.3s ease;">
                        <div style="font-size: 3rem; margin-bottom: 1rem;">🖇️</div>
                        <h3>Click to Upload PDFs</h3>
                        <p style="color: var(--text-muted); margin-bottom: 1rem;">or drag and drop PDF files here</p>
                        <input type="file" id="file-input" multiple accept=".pdf" style="display: none;">
                        <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">Select PDFs</button>
                    </div>

                    <div id="file-list" style="margin-top: 2rem; display: flex; flex-direction: column; gap: 0.5rem;">
                        <!-- File items will be added here -->
                    </div>

                    <div id="controls" style="margin-top: 2rem; display: none; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-subtle); padding-top: 1.5rem;">
                        <div>
                            <span id="file-count" style="font-weight: 600;">0 files selected</span>
                        </div>
                        <button id="merge-btn" class="btn btn-primary">Merge PDFs</button>
                    </div>
                </div>
            </div>

            <div class="ad-slot ad-content">
                <span>Advertisement</span>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 QuickNova. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/tools/pdf-merge.js"></script>
</body>
</html>
