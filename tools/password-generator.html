<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - QuickNova</title>
    <meta name="description" content="Generate strong, secure passwords instantly. Customizable length and characters.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <script src="/js/tools-mobile-optimizer.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="logo">QuickNova</a>
            <nav class="nav-links">
                <a href="/">Home</a>
                <a href="/tools/">Tools</a>
                <a href="/dashboard.html">Dashboard</a>
                <a href="/about.html">About</a>
                <a href="/contact.html">Contact</a>
                <button class="theme-toggle" aria-label="Toggle Theme">🌙</button>
            </nav>
            <button class="mobile-menu-btn" aria-label="Menu">☰</button>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="tool-header">
                <span class="tool-badge">Utility</span>
                <h1 style="margin-top: 1rem;">Password Generator</h1>
                <p style="color: var(--text-muted);">Create secure passwords to keep your accounts safe.</p>
            </div>

            <div class="tool-workspace" style="max-width: 600px; margin: 0 auto;">
                <div class="glass" style="padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem;">
                    <input type="text" id="password-output" readonly style="width: 100%; font-family: monospace; font-size: 1.5rem; background: transparent; border: none; color: var(--text-main);" value="Generating...">
                    <button id="copy-btn" class="btn btn-secondary btn-icon" title="Copy">📋</button>
                    <button id="refresh-btn" class="btn btn-secondary btn-icon" title="Generate New">🔄</button>
                </div>

                <div class="glass" style="padding: 2rem; border-radius: 12px;">
                    <!-- Mode Selection -->
                    <div style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Password Type</label>
                        <div style="display: flex; gap: 1rem;">
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="radio" name="pwd-mode" value="random" checked> Random
                            </label>
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="radio" name="pwd-mode" value="pin"> PIN
                            </label>
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="radio" name="pwd-mode" value="memorable"> Memorable
                            </label>
                        </div>
                    </div>

                    <div id="options-random">
                        <div style="margin-bottom: 2rem;">
                            <label style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-weight: 500;">
                                <span>Password Length</span>
                                <span id="length-val">16</span>
                            </label>
                            <input type="range" id="length-range" min="8" max="64" value="16" style="width: 100%;">
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" id="inc-upper" checked> Uppercase (A-Z)
                            </label>
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" id="inc-lower" checked> Lowercase (a-z)
                            </label>
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" id="inc-numbers" checked> Numbers (0-9)
                            </label>
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" id="inc-symbols" checked> Symbols (!@#$)
                            </label>
                        </div>
                    </div>

                    <div id="options-pin" style="display: none;">
                         <div style="margin-bottom: 2rem;">
                            <label style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-weight: 500;">
                                <span>PIN Length</span>
                                <span id="pin-length-val">4</span>
                            </label>
                            <input type="range" id="pin-length-range" min="4" max="12" value="4" step="1" style="width: 100%;">
                        </div>
                    </div>

                    <div id="options-memorable" style="display: none;">
                        <div style="margin-bottom: 2rem;">
                            <label style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-weight: 500;">
                                <span>Word Count</span>
                                <span id="word-count-val">4</span>
                            </label>
                            <input type="range" id="word-count-range" min="3" max="8" value="4" style="width: 100%;">
                        </div>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" id="capitalize" checked> Capitalize
                        </label>
                    </div>
                </div>
            </div>

            <div class="ad-slot ad-content">
                <span>Advertisement</span>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 QuickNova. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../js/utils.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/tools/password-generator.js"></script>
</body>
</html>
