<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker - QuickNova</title>
    <meta name="description" content="Pick colors, convert between HEX, RGB, HSL, and generate palettes. Free online tool.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="logo">QuickNova</a>
            <nav class="nav-links">
                <a href="/">Home</a>
                <a href="/tools/">Tools</a>
                <a href="/about.html">About</a>
                <a href="/contact.html">Contact</a>
                <button class="theme-toggle" aria-label="Toggle Theme">🌙</button>
            </nav>
            <button class="mobile-menu-btn" aria-label="Menu">☰</button>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="tool-header">
                <span class="tool-badge">Utility Tool</span>
                <h1 style="margin-top: 1rem;">Color Picker</h1>
                <p style="color: var(--text-muted);">Pick colors and convert formats.</p>
            </div>

            <div class="tool-workspace">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: start;">
                    
                    <!-- Color Input Area -->
                    <div class="glass" style="padding: 2rem; border-radius: 12px; text-align: center;">
                        <input type="color" id="color-input" value="#4f46e5" style="width: 100%; height: 200px; border: none; padding: 0; background: transparent; cursor: pointer;">
                        <p style="margin-top: 1rem; color: var(--text-muted);">Click above to select a color</p>
                    </div>

                    <!-- Values Area -->
                    <div class="glass" style="padding: 2rem; border-radius: 12px;">
                        <div style="margin-bottom: 1.5rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">HEX</label>
                            <div class="input-group" style="display: flex; gap: 0.5rem;">
                                <input type="text" id="hex-value" value="#4f46e5" readonly style="flex: 1; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border-subtle); background: var(--bg);">
                                <button class="btn btn-secondary copy-btn" data-target="hex-value">Copy</button>
                            </div>
                        </div>

                        <div style="margin-bottom: 1.5rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">RGB</label>
                            <div class="input-group" style="display: flex; gap: 0.5rem;">
                                <input type="text" id="rgb-value" value="rgb(79, 70, 229)" readonly style="flex: 1; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border-subtle); background: var(--bg);">
                                <button class="btn btn-secondary copy-btn" data-target="rgb-value">Copy</button>
                            </div>
                        </div>

                        <div style="margin-bottom: 1.5rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">HSL</label>
                            <div class="input-group" style="display: flex; gap: 0.5rem;">
                                <input type="text" id="hsl-value" value="hsl(243, 75%, 59%)" readonly style="flex: 1; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border-subtle); background: var(--bg);">
                                <button class="btn btn-secondary copy-btn" data-target="hsl-value">Copy</button>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Palette Generator -->
                <div style="margin-top: 3rem;">
                    <h2>Shades & Tints</h2>
                    <div id="palette" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 1rem; margin-top: 1rem;">
                        <!-- Generated by JS -->
                    </div>
                </div>
            </div>

            <div class="ad-slot ad-content">
                <span>Advertisement</span>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 QuickNova. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../js/utils.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/tools/color-picker.js"></script>
</body>
</html>
