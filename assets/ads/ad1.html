<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QuickNova Ad</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;background:transparent}
    .card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;background:#fff;border:1px solid #eee;color:#111}
    .logo{width:64px;height:48px;border-radius:6px;background:linear-gradient(135deg,#0ea5a4,#60a5fa)}
    .meta{flex:1}
    .meta .title{font-weight:700}
    .meta .desc{font-size:13px;color:#555;margin-top:6px}
    .cta{display:inline-block;padding:8px 10px;background:#0070f3;color:#fff;border-radius:8px;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <a class="card" href="/contact.html" target="_top">
    <div class="logo" aria-hidden></div>
    <div class="meta">
      <div class="title">Try QuickNova Premium</div>
      <div class="desc">Faster tools, no ads, priority support.</div>
    </div>
    <div><span class="cta">Learn</span></div>
  </a>
</body>
</html>
